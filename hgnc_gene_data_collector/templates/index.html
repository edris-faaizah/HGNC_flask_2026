<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HGNC Gene Information</title>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">

</head>
<body style="background: rgb(252, 250, 250);">
    <div class="container">
        <h1 style="text-align:center">HGNC gene</h1>
        <form action="{{ url_for('search') }}" method="post">
            
            <label for="query">Gene or HGNC ID(if HGNC ID, use format "HGNC:___"):</label>
            <input type="text" name="query" placeholder="" required>
            <br><br>
            
            
            
            <button type="submit">Search</button>
        </form>
        <br>
            {% if output_text_1 %}
                <p>{{ output_text_1 }}</p>
            {% endif %}

            {% if output_text_2 %}
                <pre>{{ output_text_2 | tojson(indent=2) }}</pre>
            {% endif %}
    </div>
</body>
</html>
