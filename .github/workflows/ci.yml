name: HGNC Flask CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t hgnc-gene-test .

      - name: Run app
        run: |
          docker run -d \
            --name hgnc-gene-test \
            -it \
            --rm \
            -p 8000:8000 \
            hgnc-gene-test

      - name: Run pytest
        run: |
          docker exec hgnc-gene-test \
            pytest \
            --cov=hgnc_gene_data_collector \
            --cov-branch \
            --cov-report=xml \
            tests
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}